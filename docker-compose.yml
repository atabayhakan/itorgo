services:
  web:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itorgo
      POSTGRES_PASSWORD: itorgo
      POSTGRES_DB: itorgo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itorgo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
